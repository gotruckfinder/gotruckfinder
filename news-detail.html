<section class="page-intro"><h1>NEWS ARTICLE</h1><p>Full article and details.</p></section><main class="detail-wrap"><a class="detail-back" href="news.html">← Back to News</a><div id="detailContent" class="detail-panel"><div class="detail-state">Loading...</div></div></main><footer class="footer">© GoTruckFinder. All rights reserved.</footer>
<script>
(function(){
 const target=document.getElementById("detailContent");
 const slug=new URLSearchParams(location.search).get("slug")||"";
 function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
 function rich(value){
  const doc=new DOMParser().parseFromString(String(value||""),"text/html");
  const allowed=new Set(["P","BR","STRONG","B","EM","I","U","UL","OL","LI","H2","H3","BLOCKQUOTE","DIV","SPAN","IMG","A","TABLE","THEAD","TBODY","TR","TH","TD"]);
  const clean=node=>Array.from(node.childNodes).forEach(ch=>{
   if(ch.nodeType===Node.ELEMENT_NODE){
    if(!allowed.has(ch.tagName)){ch.replaceWith(document.createTextNode(ch.textContent||""));return;}
    Array.from(ch.attributes).forEach(a=>{if(ch.tagName==="IMG"&&["src","alt","title","width","height"].includes(a.name))return;if(ch.tagName==="A"&&["href","title"].includes(a.name))return;ch.removeAttribute(a.name);});
    if(ch.tagName==="IMG"){try{const u=new URL(ch.getAttribute("src")||"",location.href);if(u.protocol!=="https:"){ch.remove();return;}}catch{ch.remove();return;}ch.loading="lazy";}
    if(ch.tagName==="A"){try{const u=new URL(ch.getAttribute("href")||"",location.href);if(u.protocol!=="https:")ch.removeAttribute("href");else{ch.rel="noopener noreferrer";ch.target="_blank";}}catch{ch.removeAttribute("href");}}
    clean(ch);
   }else if(ch.nodeType!==Node.TEXT_NODE)ch.remove();
  });
  clean(doc.body);return doc.body.innerHTML;
 }
 if(!slug){target.innerHTML='<div class="detail-state">Content not found.</div>';return;}
 fetch("https://gotruckfinder.com/api/public/news",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Unable to load content.");return r.json();}).then(data=>{
  const item=(data.items||[]).find(x=>String(x.slug||"")===slug);
  if(!item){target.innerHTML='<div class="detail-state">This content is unavailable or has been unpublished.</div>';return;}
  document.title=(item.seo_title||item.title)+" | GoTruckFinder";
  const cover=item.cover_url?'<img class="detail-cover" src="'+esc(item.cover_url)+'" alt="'+esc(item.title)+'">':"";
  const date=item.published_at?'<time class="detail-date">'+esc(item.published_at)+'</time>':"";
  const summary=item.summary?'<div class="detail-summary">'+rich(item.summary)+'</div>':"";
  const body=item.body?'<div class="detail-body">'+rich(item.body)+'</div>':"";
  target.innerHTML=date+'<h1>'+esc(item.title)+'</h1>'+cover+summary+body;
 }).catch(error=>{target.innerHTML='<div class="detail-state">'+esc(error.message)+'</div>';});
})();
</script>
