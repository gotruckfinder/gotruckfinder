
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Used commercial vehicle details from Truck Finder China.">
<title>Vehicle Details | TRUCK FINDER</title>

<style>
:root{
  --blue:#0646ad;
  --deep:#063b91;
  --yellow:#ffbd00;
  --ink:#092b78;
  --light:#f4f8ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#fff;
}
a{text-decoration:none;color:inherit}

header{
  min-height:85px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 4%;
  background:#f4f8ff;
  border-bottom:1px solid #dce9ff;
  gap:15px;
}
.brand{
  font-size:29px;
  font-weight:900;
  color:var(--blue);
}
.brand span{color:var(--yellow)}
nav{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:14px;
  font-weight:bold;
}
.contact{
  background:var(--blue);
  color:white;
  padding:12px 18px;
  border-radius:9px;
}
main{
  max-width:1150px;
  margin:auto;
  padding:35px 22px 65px;
}
.crumb{
  color:#71809a;
  font-size:14px;
  margin-bottom:25px;
}
.crumb a{color:var(--blue)}
h1{
  font-size:clamp(27px,4vw,40px);
  margin:0 0 12px;
  color:var(--deep);
}
.subtitle{
  color:#71809a;
  margin-bottom:25px;
}
.layout{
  display:grid;
  grid-template-columns:1.15fr 1fr;
  gap:30px;
}
.main-image{
  width:100%;
  height:390px;
  object-fit:cover;
  border-radius:12px;
  background:#edf3fb;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:12px;
}
.gallery img{
  width:100%;
  height:85px;
  object-fit:cover;
  border-radius:7px;
  cursor:pointer;
  background:#edf3fb;
}
.info{
  border:1px solid #e0e8f5;
  border-radius:12px;
  padding:24px;
}
.info h2{margin:0 0 18px}
.spec-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #edf1f7;
  font-size:14px;
}
.spec-row span:first-child{color:#71809a}
.spec-row strong{text-align:right}
.description{
  margin-top:28px;
  line-height:1.8;
  color:#526581;
}
.buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
}
.buttons a,
.buttons button{
  flex:1;
  text-align:center;
  padding:14px 10px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
}
.whatsapp{
  background:#20b84c;
  color:white;
}
.back{
  background:#edf4ff;
  color:var(--blue);
}
.inquiry-now{
  border:0;
  cursor:pointer;
  background:var(--blue);
  color:white;
}
.not-found{
  background:var(--light);
  border:1px solid #dce9ff;
  border-radius:12px;
  padding:40px 20px;
  text-align:center;
}

/* Online inquiry form */
.inquiry-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(5,20,50,.65);
  padding:20px;
  overflow-y:auto;
  align-items:center;
  justify-content:center;
}
.inquiry-modal.show{
  display:flex;
}
.inquiry-panel{
  background:white;
  width:100%;
  max-width:520px;
  padding:28px;
  border-radius:14px;
  position:relative;
  color:var(--ink);
}
.inquiry-panel h2{
  margin:0 0 8px;
}
.inquiry-panel .form-intro{
  color:#71809a;
  font-size:14px;
  margin-bottom:20px;
}
.inquiry-panel label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:13px 0 6px;
}
.inquiry-panel input,
.inquiry-panel textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5deeb;
  border-radius:7px;
  font:inherit;
  font-size:14px;
}
.inquiry-panel textarea{
  min-height:100px;
  resize:vertical;
}
.inquiry-close{
  position:absolute;
  top:12px;
  right:16px;
  border:0;
  background:none;
  font-size:26px;
  cursor:pointer;
  color:#71809a;
}
.inquiry-submit{
  width:100%;
  border:0;
  background:var(--blue);
  color:white;
  padding:14px;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  margin-top:18px;
}
.inquiry-submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.inquiry-status{
  font-size:14px;
  margin-top:12px;
  line-height:1.5;
}

footer{
  background:#062f78;
  color:#dbe8ff;
  text-align:center;
  padding:25px;
  font-size:13px;
}

@media(max-width:750px){
  header{flex-direction:column}
  nav{justify-content:center}
  .layout{grid-template-columns:1fr}
  .main-image{height:270px}
  main{padding:25px 15px 45px}
  .buttons{flex-wrap:wrap}
  .buttons a,
  .buttons button{min-width:100%}
  .inquiry-panel{padding:24px 20px}
}
</style>
</head>

<body>

<header>
  <a class="brand" href="index.html">
    TRUCK <span>FINDER</span>
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="truck-cranes.html">Truck Cranes</a>
    <a href="dump-trucks.html">Dump Trucks</a>
    <a href="aerial-work-platforms.html">Aerial Work Platforms</a>
    <a href="special-vehicles.html">Special Vehicles</a>
  </nav>

  <a class="contact"
   href="https://wa.me/8617362687151"
   target="_blank"
   rel="noopener noreferrer">
   WhatsApp Us
  </a>
</header>

<main>

<div class="crumb">
  <a href="index.html">Home</a> ›
  <a href="truck-cranes.html">Vehicles</a> › Details
</div>

<div id="vehicleContent"></div>

<!-- Inquiry form -->
<div class="inquiry-modal" id="inquiryModal">
  <div class="inquiry-panel">

    <button type="button" class="inquiry-close"
      id="closeInquiry" aria-label="Close">&times;</button>

    <h2>Vehicle Inquiry</h2>
    <p class="form-intro">
      Please complete the form. Our team will contact you soon.
    </p>

    <form id="inquiryForm">

      <label for="inquiryName">Name *</label>
      <input id="inquiryName" name="name"
        type="text" maxlength="100" required>

      <label for="inquiryCountry">Country *</label>
      <input id="inquiryCountry" name="country"
        type="text" maxlength="100" required>

      <label for="inquiryWhatsApp">WhatsApp Number</label>
      <input id="inquiryWhatsApp" name="whatsapp"
        type="tel" maxlength="50"
        placeholder="Include country code">

      <label for="inquiryEmail">Email Address</label>
      <input id="inquiryEmail" name="email"
        type="email" maxlength="254">

      <label for="inquiryMessage">Message</label>
      <textarea id="inquiryMessage" name="message"
        maxlength="3000"
        placeholder="Please tell us what information you need."></textarea>

      <button class="inquiry-submit" id="inquirySubmit"
        type="submit">Submit Inquiry</button>

      <p class="inquiry-status" id="inquiryStatus"
        role="status" aria-live="polite"></p>

    </form>
  </div>
</div>

</main>

<footer>
TRUCK FINDER · Find Your Right Truck.
· Used Commercial Vehicles from China
</footer>

<script src="vehicles.js"></script>

<script>

const params = new URLSearchParams(window.location.search);
const vehicleId = params.get("id");

// Vehicle inventory
const allVehicles = window.TRUCK_FINDER_VEHICLES || [];

// Show available truck cranes only
const vehicles = allVehicles.filter(v =>
  v.category === "Truck Cranes" &&
  v.status === "Available"
);

const vehicle = vehicles.find(v => v.id === vehicleId);

const container = document.getElementById("vehicleContent");

function addSpec(parent,label,value){
  if(value === undefined || value === null || value === "") return;

  const row = document.createElement("div");
  row.className = "spec-row";

  const name = document.createElement("span");
  name.textContent = label;

  const content = document.createElement("strong");
  content.textContent = value;

  row.append(name,content);
  parent.appendChild(row);
}

if(!vehicle){

  document.title = "Vehicle Not Found | TRUCK FINDER";

  const box = document.createElement("div");
  box.className = "not-found";

  const heading = document.createElement("h2");
  heading.textContent = "Vehicle Not Found";

  const message = document.createElement("p");
  message.textContent =
    "This vehicle may have been removed or the link may be incorrect.";

  const link = document.createElement("a");
  link.href = "index.html";
  link.textContent = "Return to Home";
  link.className = "contact";

  box.append(heading,message,link);
  container.appendChild(box);

}else{

  document.title = vehicle.title + " | TRUCK FINDER";

  const title = document.createElement("h1");
  title.textContent = vehicle.title;

  const subtitle = document.createElement("p");
  subtitle.className = "subtitle";
  subtitle.textContent = "Vehicle ID: " + vehicle.id;

  const layout = document.createElement("div");
  layout.className = "layout";

  const left = document.createElement("div");

  const mainImage = document.createElement("img");
  mainImage.className = "main-image";
  mainImage.alt = vehicle.title;

  const images = vehicle.images || [];
  const firstImage = images[0] || vehicle.image || "";

  if(firstImage){
    mainImage.src = firstImage;
  }else{
    mainImage.style.display = "none";
  }

  left.appendChild(mainImage);

  const gallery = document.createElement("div");
  gallery.className = "gallery";

  images.forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    img.alt = vehicle.title;
    img.loading = "lazy";

    img.addEventListener("click",()=>{
      mainImage.src = src;
      mainImage.style.display = "block";
    });

    gallery.appendChild(img);
  });

  left.appendChild(gallery);

  const right = document.createElement("section");
  right.className = "info";

  const heading = document.createElement("h2");
  heading.textContent = "Vehicle Specifications";
  right.appendChild(heading);

  addSpec(right,"Category",vehicle.category);
  addSpec(right,"Brand",vehicle.brand);
  addSpec(right,"Model",vehicle.model);
  addSpec(right,"Year",vehicle.year);
  addSpec(right,"Mileage",vehicle.mileage);
  addSpec(right,"Chassis",vehicle.chassis);
  addSpec(right,"Crane Brand",vehicle.crane);
  addSpec(right,"Lifting Capacity",vehicle.ton);
  addSpec(right,"Boom Length",vehicle.boomLength);
  addSpec(right,"Location",vehicle.location);
  addSpec(right,"Price",vehicle.price || "Contact for Price");
  addSpec(right,"Status",vehicle.status);

  const description = document.createElement("div");
  description.className = "description";

  const descTitle = document.createElement("h3");
  descTitle.textContent = "Vehicle Description";

  const descText = document.createElement("p");
  descText.textContent =
    vehicle.description || "Please contact us for more vehicle information.";

  description.append(descTitle,descText);
  right.appendChild(description);

  const buttons = document.createElement("div");
  buttons.className = "buttons";

  // WhatsApp inquiry
  const message =
    "Hello Truck Finder, I am interested in this vehicle:\n\n" +
    "Vehicle: " + vehicle.title + "\n" +
    "Vehicle ID: " + vehicle.id + "\n" +
    "Brand: " + vehicle.brand + "\n" +
    "Model: " + vehicle.model + "\n" +
    "Year: " + vehicle.year + "\n" +
    "Lifting Capacity: " + vehicle.ton + "\n\n" +
    "Please send me more details and an export quotation.";

  const inquiry = document.createElement("a");
  inquiry.className = "whatsapp";
  inquiry.href =
    "https://wa.me/8617362687151?text=" +
    encodeURIComponent(message);
  inquiry.target = "_blank";
  inquiry.rel = "noopener noreferrer";
  inquiry.textContent = "WhatsApp Us";

  // Online inquiry
  const email = document.createElement("button");
  email.type = "button";
  email.className = "inquiry-now";
  email.textContent = "Inquiry Now";

  email.addEventListener("click", () => {
    document.getElementById("inquiryModal").classList.add("show");
    document.getElementById("inquiryName").focus();
  });

  // Back to listings
  const back = document.createElement("a");
  back.className = "back";
  back.href = "truck-cranes.html";
  back.textContent = "Back to Listings";

  buttons.append(inquiry, email, back);

  right.appendChild(buttons);

  layout.append(left,right);
  container.append(title,subtitle,layout);

}

// Inquiry form controls
const inquiryModal = document.getElementById("inquiryModal");
const inquiryForm = document.getElementById("inquiryForm");
const inquiryStatus = document.getElementById("inquiryStatus");
const inquirySubmit = document.getElementById("inquirySubmit");

document.getElementById("closeInquiry").addEventListener("click", () => {
  inquiryModal.classList.remove("show");
});

inquiryModal.addEventListener("click", (event) => {
  if (event.target === inquiryModal) {
    inquiryModal.classList.remove("show");
  }
});

// Submit inquiry to Cloudflare Worker
inquiryForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!vehicle) return;

  inquirySubmit.disabled = true;
  inquirySubmit.textContent = "Submitting...";
  inquiryStatus.style.color = "#526581";
  inquiryStatus.textContent = "Please wait while we submit your inquiry.";

  const formData = new FormData(inquiryForm);

  const inquiryData = {
    name: formData.get("name").trim(),
    country: formData.get("country").trim(),
    whatsapp: formData.get("whatsapp").trim(),
    email: formData.get("email").trim(),
    message: formData.get("message").trim(),
    vehicleId: vehicle.id,
    vehicleTitle: vehicle.title
  };

  try {
    const response = await fetch(
      "https://gotruckfinder-inquiry.cscvehicle.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(inquiryData)
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Submission failed");
    }

    inquiryStatus.style.color = "#16803c";
    inquiryStatus.textContent =
      "Thank you! Your inquiry has been submitted successfully.";

    inquiryForm.reset();

    inquirySubmit.textContent = "Submit Inquiry";
    inquirySubmit.disabled = false;

  } catch (error) {
    console.error("Inquiry submission error:", error);

    inquiryStatus.style.color = "#c62828";
    inquiryStatus.textContent =
      "Sorry, your inquiry could not be submitted. Please try WhatsApp instead.";

    inquirySubmit.textContent = "Submit Inquiry";
    inquirySubmit.disabled = false;
  }
});

</script>

</body>
</html>
