
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Used commercial vehicle details from Truck Finder China.">
<title>Vehicle Details | TRUCK FINDER</title>

<style>
:root{
  --blue:#0646ad;
  --deep:#063b91;
  --yellow:#ffbd00;
  --ink:#092b78;
  --light:#f4f8ff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#fff;
}
a{text-decoration:none;color:inherit}

header{
  min-height:85px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 4%;
  background:#f4f8ff;
  border-bottom:1px solid #dce9ff;
  gap:15px;
}
.brand{
  font-size:29px;
  font-weight:900;
  color:var(--blue);
}
.brand span{color:var(--yellow)}
nav{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  font-size:14px;
  font-weight:bold;
}
.contact{
  background:var(--blue);
  color:white;
  padding:12px 18px;
  border-radius:9px;
}
main{
  max-width:1150px;
  margin:auto;
  padding:35px 22px 65px;
}
.crumb{
  color:#71809a;
  font-size:14px;
  margin-bottom:25px;
}
.crumb a{color:var(--blue)}
h1{
  font-size:clamp(27px,4vw,40px);
  margin:0 0 12px;
  color:var(--deep);
}
.subtitle{
  color:#71809a;
  margin-bottom:25px;
}
.layout{
  display:grid;
  grid-template-columns:1.15fr 1fr;
  gap:30px;
}
.main-image{
  width:100%;
  height:390px;
  object-fit:cover;
  border-radius:12px;
  background:#edf3fb;
}
.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:12px;
}
.gallery img{
  width:100%;
  height:85px;
  object-fit:cover;
  border-radius:7px;
  cursor:pointer;
  background:#edf3fb;
}
.info{
  border:1px solid #e0e8f5;
  border-radius:12px;
  padding:24px;
}
.info h2{margin:0 0 18px}
.spec-row{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #edf1f7;
  font-size:14px;
}
.spec-row span:first-child{color:#71809a}
.spec-row strong{text-align:right}
.description{
  margin-top:28px;
  line-height:1.8;
  color:#526581;
}
.buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
}
.buttons a,
.buttons button{
  flex:1;
  text-align:center;
  padding:14px 10px;
  border-radius:8px;
  font-weight:bold;
  font-size:14px;
}
.whatsapp{
  background:#20b84c;
  color:white;
}
.back{
  background:#edf4ff;
  color:var(--blue);
}
.inquiry-now{
  border:0;
  cursor:pointer;
  background:var(--blue);
  color:white;
}
.not-found{
  background:var(--light);
  border:1px solid #dce9ff;
  border-radius:12px;
  padding:40px 20px;
  text-align:center;
}

/* Online inquiry form */
.inquiry-modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(5,20,50,.65);
  padding:20px;
  overflow-y:auto;
  align-items:center;
  justify-content:center;
}
.inquiry-modal.show{
  display:flex;
}
.inquiry-panel{
  background:white;
  width:100%;
  max-width:520px;
  padding:28px;
  border-radius:14px;
  position:relative;
  color:var(--ink);
}
.inquiry-panel h2{
  margin:0 0 8px;
}
.inquiry-panel .form-intro{
  color:#71809a;
  font-size:14px;
  margin-bottom:20px;
}
.inquiry-panel label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin:13px 0 6px;
}
.inquiry-panel input,
.inquiry-panel textarea{
  width:100%;
  padding:12px;
  border:1px solid #d5deeb;
  border-radius:7px;
  font:inherit;
  font-size:14px;
}
.inquiry-panel textarea{
  min-height:100px;
  resize:vertical;
}
.inquiry-close{
  position:absolute;
  top:12px;
  right:16px;
  border:0;
  background:none;
  font-size:26px;
  cursor:pointer;
  color:#71809a;
}
.inquiry-submit{
  width:100%;
  border:0;
  background:var(--blue);
  color:white;
  padding:14px;
  border-radius:8px;
  font-weight:bold;
  font-size:15px;
  cursor:pointer;
  margin-top:18px;
}
.inquiry-submit:disabled{
  opacity:.6;
  cursor:not-allowed;
}
.inquiry-status{
  font-size:14px;
  margin-top:12px;
  line-height:1.5;
}

footer{
  background:#062f78;
  color:#dbe8ff;
  text-align:center;
  padding:25px;
  font-size:13px;
}

@media(max-width:750px){
  header{flex-direction:column}
  nav{justify-content:center}
  .layout{grid-template-columns:1fr}
  .main-image{height:270px}
  main{padding:25px 15px 45px}
  .buttons{flex-wrap:wrap}
  .buttons a,
  .buttons button{min-width:100%}
  .inquiry-panel{padding:24px 20px}
}

/* Unified responsive navigation */
.site-header{
  width:100%;min-height:88px;display:grid;grid-template-columns:auto minmax(0,1fr) 48px;
  align-items:center;gap:clamp(14px,2vw,30px);padding:12px clamp(18px,3vw,48px);
  position:relative;z-index:1000;background:linear-gradient(90deg,#fff,#eef6ff);
  border-bottom:1px solid #dce9ff;box-sizing:border-box;
}
.site-header .brand{display:block;white-space:nowrap;font-size:29px;font-weight:900;letter-spacing:.4px;color:#0646ad}
.site-header .brand span{color:#ffbd00}
.site-header .site-nav{width:100%;min-width:0;display:flex;align-items:center;justify-content:space-around;gap:clamp(8px,1.3vw,22px);flex-wrap:nowrap;background:transparent;padding:0;margin:0;font-size:18px;font-weight:800;white-space:nowrap}
.site-header .site-nav>a,.site-header .nav-placeholder,.site-header .nav-products{
  display:flex;align-items:center;justify-content:center;flex:1 1 auto;min-width:0;
  padding:14px 4px;color:#092b78;text-decoration:none;font:inherit;font-size:18px;font-weight:800;
  text-align:center;border:0;border-bottom:3px solid transparent;background:transparent;cursor:pointer;
}
.site-header .site-nav>a:hover,.site-header .nav-products:hover,.site-header .site-nav>a:focus-visible,.site-header .nav-products:focus-visible{
  color:#0064d8;border-bottom-color:#1685ff;outline-offset:3px;
}
.site-header .nav-dropdown{position:relative;display:flex;flex:1 1 auto;justify-content:center;min-width:0}
.site-header .nav-products{width:100%;gap:7px}
.site-header .nav-dropdown-menu{
  display:none;position:absolute;left:0;top:100%;min-width:245px;padding:8px 0;background:#fff;
  border:1px solid #dce9ff;border-radius:0 0 10px 10px;box-shadow:0 10px 24px rgba(9,43,120,.16);z-index:1100;
}
.site-header .nav-dropdown-menu a{display:block;padding:12px 18px;color:#092b78;font-size:15px;font-weight:700;white-space:nowrap;text-decoration:none}
.site-header .nav-dropdown-menu a:hover{background:#f0f6ff;color:#0064d8}
.site-header .nav-dropdown:hover .nav-dropdown-menu,.site-header .nav-dropdown:focus-within .nav-dropdown-menu,.site-header .nav-dropdown.products-open .nav-dropdown-menu{display:block}
.site-header .quote-button{
  position:relative;width:48px;height:48px;display:flex;align-items:center;justify-content:center;
  background:#0646ad;color:#fff;border-radius:8px;text-decoration:none;flex:0 0 48px;
  box-shadow:0 2px 7px rgba(6,70,173,.18);
}
.site-header .quote-button:hover{background:#063b91}
.site-header .quote-icon{font-size:24px;line-height:1}
.site-header .quote-label{
  position:absolute;right:0;top:calc(100% + 8px);padding:7px 10px;border-radius:5px;
  background:#092b78;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;
  opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s;
}
.site-header .quote-button:hover .quote-label,.site-header .quote-button:focus-visible .quote-label{opacity:1;visibility:visible}
.site-header .nav-toggle{display:none}
@media(max-width:900px){
 .site-header{grid-template-columns:minmax(0,1fr) 44px 48px;gap:10px;min-height:72px;padding:10px 16px}
 .site-header .nav-toggle{display:flex;width:44px;height:44px;align-items:center;justify-content:center;border:1px solid #cbdaf0;border-radius:7px;background:#fff;color:#0646ad;font-size:25px;cursor:pointer}
 .site-header .site-nav{display:none;position:absolute;left:0;right:0;top:100%;width:100%;padding:10px 16px 16px;flex-direction:column;align-items:stretch;gap:0;background:#0646ad;box-shadow:0 8px 18px rgba(0,0,0,.15);white-space:normal}
 .site-header.nav-open .site-nav{display:flex}
 .site-header .site-nav>a,.site-header .nav-placeholder,.site-header .nav-products{
   width:100%;min-height:46px;justify-content:flex-start;padding:12px 8px;color:#fff!important;
   font-size:16px;text-align:left;border-bottom:1px solid rgba(255,255,255,.18)
 }
 .site-header .nav-dropdown{display:block;width:100%}
 .site-header .nav-products{justify-content:space-between}
 .site-header .nav-dropdown-menu{position:static;min-width:0;border:0;border-radius:0;box-shadow:none;padding:0 0 6px;background:#0a3f91}
 .site-header .nav-dropdown-menu a{padding:11px 22px;color:#fff;font-size:14px}
 .site-header .nav-dropdown-menu a:hover{background:#1456ad;color:#fff}
 .site-header .nav-dropdown:hover .nav-dropdown-menu{display:none}
 .site-header .nav-dropdown:focus-within .nav-dropdown-menu{display:none}
 .site-header .nav-dropdown.products-open .nav-dropdown-menu{display:block}
 .site-header.home-header{grid-template-columns:44px minmax(0,1fr) 48px}
 .site-header .nav-dropdown.products-open .nav-dropdown-menu,.site-header .nav-dropdown:focus-within .nav-dropdown-menu{display:block}
 .site-header .quote-button{width:44px;height:44px;flex-basis:44px}
 .site-header .quote-label{display:none}
}

</style>
</head>

  <a class="brand" href="index.html" aria-label="TRUCK FINDER HOME">TRUCK <span>FINDER</span></a>

<main>

<div class="crumb">
  <a href="index.html">Home</a> &rsaquo;
  <a href="truck-cranes.html">Vehicles</a> &rsaquo;Details
</div>

<div id="vehicleContent"></div>

<!-- Inquiry form -->
<div class="inquiry-modal" id="inquiryModal">
  <div class="inquiry-panel">

    <button type="button" class="inquiry-close"
      id="closeInquiry" aria-label="Close">&times;</button>

    <h2>Vehicle Inquiry</h2>
    <p class="form-intro">

    <form id="inquiryForm" onsubmit="return false;">

</main>

<footer>

<script>
(function () {
const params = new URLSearchParams(window.location.search);
const vehicleId = params.get("id");

// Vehicle inventory
const allVehicles = window.TRUCK_FINDER_VEHICLES || [];

// Show available truck cranes only
const vehicles = allVehicles.filter(v =>
  v.status === "Available"
);

let vehicle = allVehicles.find(v => String(v.id) === String(vehicleId));

const container = document.getElementById("vehicleContent");

function addSpec(parent,label,value){
  if(value === undefined || value === null || value === "") return;

  const row = document.createElement("div");
  row.className = "spec-row";

  const name = document.createElement("span");
  name.textContent = label;

  const content = document.createElement("strong");
  content.textContent = value;

  row.append(name,content);
  parent.appendChild(row);
}

function renderVehicle(){
if(!vehicle){

  document.title = "Vehicle Not Found | TRUCK FINDER";

  const box = document.createElement("div");
  box.className = "not-found";

  const heading = document.createElement("h2");
  heading.textContent = "Vehicle Not Found";

  const message = document.createElement("p");
  message.textContent =
    "This vehicle may have been removed or the link may be incorrect.";

  const link = document.createElement("a");
  link.href = "index.html";
  link.textContent = "Return to Home";
  link.className = "contact";

  box.append(heading,message,link);
  container.appendChild(box);

}else{

  document.title = vehicle.title + " | TRUCK FINDER";
  const serverSeoTitle = document.querySelector('meta[name="tf:seo-title"]')?.content || "";
  const serverSeoDescription = document.querySelector('meta[name="tf:seo-description"]')?.content || "";
  const serverSeoImageAlt = document.querySelector('meta[name="tf:seo-image-alt"]')?.content || "";
  const seoTitle = vehicle.seoTitle || serverSeoTitle || (vehicle.title + " | TRUCK FINDER");
  const seoDescription = vehicle.metaDescription || serverSeoDescription || vehicle.description ||
    "Explore this used commercial vehicle from China. Contact Truck Finder for details and an export quotation.";
  const seoImage = vehicle.image || (Array.isArray(vehicle.images) ? vehicle.images[0] : "") || "";
  const seoImageAlt = vehicle.imageAlt || serverSeoImageAlt || vehicle.title || "Truck Finder vehicle";

  document.title = seoTitle;
  if (typeof window.applyTruckFinderSEO === "function") {
    window.applyTruckFinderSEO({ title: seoTitle, description: seoDescription, image: seoImage, imageAlt: seoImageAlt });
  }
  const title = document.createElement("h1");
  title.textContent = vehicle.title;

  const subtitle = document.createElement("p");
  subtitle.className = "subtitle";
  subtitle.textContent = "Vehicle ID: " + vehicle.id;

  const layout = document.createElement("div");
  layout.className = "layout";

  const left = document.createElement("div");

  const mainImage = document.createElement("img");
  mainImage.className = "main-image";
  mainImage.alt = seoImageAlt;

  const images = vehicle.images || [];
  const firstImage = images[0] || vehicle.image || "";

  if(firstImage){
    mainImage.src = firstImage;
  }else{
    mainImage.style.display = "none";
  }

  left.appendChild(mainImage);

  const gallery = document.createElement("div");
  gallery.className = "gallery";

  images.forEach(src=>{
    const img = document.createElement("img");
    img.src = src;
    img.alt = seoImageAlt;
    img.loading = "lazy";

    img.addEventListener("click",()=>{
      mainImage.src = src;
      mainImage.style.display = "block";
    });

    gallery.appendChild(img);
  });

  left.appendChild(gallery);

  if (vehicle.video_url) {
    const videoSection = document.createElement("section");
    videoSection.className = "vehicle-video";
    videoSection.style.cssText = "margin-top:22px;width:100%;";

    const videoHeading = document.createElement("h2");
    videoHeading.textContent = "Vehicle Video";
    videoHeading.style.cssText = "font-size:20px;margin:0 0 12px;";
    videoSection.appendChild(videoHeading);

    try {
      const videoUrl = new URL(vehicle.video_url);
      if (videoUrl.protocol !== "https:") throw new Error("HTTPS video URL required");

      if (videoUrl.hostname === "youtu.be" || videoUrl.hostname.endsWith("youtube.com")) {
        const videoId = videoUrl.hostname === "youtu.be"
          ? videoUrl.pathname.slice(1)
          : (videoUrl.searchParams.get("v") || videoUrl.pathname.split("/").filter(Boolean).pop());
        if (!/^[A-Za-z0-9_-]{6,20}$/.test(videoId || "")) throw new Error("Invalid YouTube URL");
        const frame = document.createElement("iframe");
        frame.src = "https://www.youtube-nocookie.com/embed/" + videoId;
        frame.title = vehicle.title + " video";
        frame.loading = "lazy";
        frame.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        frame.allowFullscreen = true;
        frame.style.cssText = "width:100%;aspect-ratio:16/9;border:0;border-radius:10px;";
        videoSection.appendChild(frame);
      } else if (videoUrl.hostname === "vimeo.com" || videoUrl.hostname.endsWith(".vimeo.com")) {
        const videoId = videoUrl.pathname.split("/").filter(Boolean).pop();
        if (!/^\d+$/.test(videoId || "")) throw new Error("Invalid Vimeo URL");
        const frame = document.createElement("iframe");
        frame.src = "https://player.vimeo.com/video/" + videoId;
        frame.title = vehicle.title + " video";
        frame.loading = "lazy";
        frame.allow = "autoplay; fullscreen; picture-in-picture";
        frame.allowFullscreen = true;
        frame.style.cssText = "width:100%;aspect-ratio:16/9;border:0;border-radius:10px;";
        videoSection.appendChild(frame);
      } else {
        const video = document.createElement("video");
        video.src = videoUrl.href;
        video.controls = true;
        video.preload = "metadata";
        video.playsInline = true;
        video.style.cssText = "display:block;width:100%;max-height:520px;background:#111;border-radius:10px;";
        videoSection.appendChild(video);
      }

      left.appendChild(videoSection);
    } catch (error) {
      console.warn("Vehicle video URL is invalid or unsupported:", error);
    }
  }

  const right = document.createElement("section");
  right.className = "info";

  const heading = document.createElement("h2");
  heading.textContent = "Vehicle Specifications";
  right.appendChild(heading);

  addSpec(right,"Category",vehicle.category);
  addSpec(right,"Vehicle Type",vehicle.sub_category);
  addSpec(right,"Brand",vehicle.brand);
  addSpec(right,"Model",vehicle.model);
  addSpec(right,"Year",vehicle.year);
  addSpec(right,"Mileage",vehicle.mileage);
  addSpec(right,"Chassis",vehicle.chassis);
  addSpec(right,"Crane Brand",vehicle.crane);
  addSpec(right,"Lifting Capacity",vehicle.ton);
  addSpec(right,"Boom Length",vehicle.boomLength);
  addSpec(right,"Drive Type",vehicle.location);
  addSpec(right,"Price",vehicle.price || "Contact for Price");
  addSpec(right,"Status",vehicle.status);

  const description = document.createElement("div");
  description.className = "description";

  const descTitle = document.createElement("h3");
  descTitle.textContent = "Vehicle Description";

  const descText = document.createElement("p");
  descText.textContent =
    vehicle.description || "Please contact us for more vehicle information.";

  description.append(descTitle,descText);
  right.appendChild(description);

  const buttons = document.createElement("div");
  buttons.className = "buttons";

  // WhatsApp inquiry
  const message =
    "Hello Truck Finder, I am interested in this vehicle:\n\n" +
    "Vehicle: " + vehicle.title + "\n" +
    "Vehicle ID: " + vehicle.id + "\n" +
    "Brand: " + vehicle.brand + "\n" +
    "Model: " + vehicle.model + "\n" +
    "Year: " + vehicle.year + "\n" +
    "Lifting Capacity: " + vehicle.ton + "\n\n" +
    "Please send me more details and an export quotation.";

  const inquiry = document.createElement("a");
  inquiry.className = "whatsapp";
  inquiry.href =
    "https://wa.me/8617362687151?text=" +
    encodeURIComponent(message);
  inquiry.target = "_blank";
  inquiry.rel = "noopener noreferrer";
  inquiry.textContent = "WhatsApp Us";

  // Online inquiry
  const email = document.createElement("button");
  email.type = "button";
  email.className = "inquiry-now";
  email.textContent = "Inquiry Now";

  email.addEventListener("click", () => {
    document.getElementById("inquiryModal").classList.add("show");
    document.getElementById("inquiryName").focus();
  });

  // Back to listings
  const back = document.createElement("a");
  back.className = "back";
  const categoryListingPages = {
    "Truck Cranes": "truck-cranes.html",
    "Aerial Work Platforms": "aerial-work-platforms.html"
  };
  back.href = categoryListingPages[vehicle.category] || "index.html";
  back.textContent = "Back to Listings";

  buttons.append(inquiry, email, back);

  right.appendChild(buttons);

  layout.append(left,right);
  container.append(title,subtitle,layout);

}


}

renderVehicle();

// Inquiry form controls
const inquiryModal = document.getElementById("inquiryModal");
const inquiryForm = document.getElementById("inquiryForm");
const inquiryStatus = document.getElementById("inquiryStatus");
const inquirySubmit = document.getElementById("inquirySubmit");

document.getElementById("closeInquiry").addEventListener("click", () => {
  inquiryModal.classList.remove("show");
});

inquiryModal.addEventListener("click", (event) => {
  if (event.target === inquiryModal) {
    inquiryModal.classList.remove("show");
  }
});

// Submit inquiry to Cloudflare Worker
inquiryForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!vehicle) return;

  inquirySubmit.disabled = true;
  inquirySubmit.textContent = "Submitting...";
  inquiryStatus.style.color = "#526581";
  inquiryStatus.textContent = "Please wait while we submit your inquiry.";

  const formData = new FormData(inquiryForm);

  const inquiryData = {
    name: formData.get("name").trim(),
    country: formData.get("country").trim(),
    whatsapp: formData.get("whatsapp").trim(),
    email: formData.get("email").trim(),
    message: formData.get("message").trim(),
    vehicleId: vehicle.id,
    vehicleTitle: vehicle.title
  };

  try {
    const response = await fetch(
      "https://gotruckfinder-inquiry.cscvehicle.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(inquiryData)
      }
    );

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.message || "Submission failed");
    }

    inquiryStatus.style.color = "#16803c";
    inquiryStatus.textContent =
      "Thank you! Your inquiry has been submitted successfully.";

    inquiryForm.reset();

    inquirySubmit.textContent = "Submit Inquiry";
    inquirySubmit.disabled = false;

  } catch (error) {
    console.error("Inquiry submission error:", error);

    inquiryStatus.style.color = "#c62828";
    inquiryStatus.textContent =
      "Sorry, your inquiry could not be submitted. Please try WhatsApp instead.";

    inquirySubmit.textContent = "Submit Inquiry";
    inquirySubmit.disabled = false;
  }
});

// Refresh the displayed record when the background inventory request completes.
if(window.TRUCK_FINDER_VEHICLES_READY &&
   typeof window.TRUCK_FINDER_VEHICLES_READY.then === "function"){
  window.TRUCK_FINDER_VEHICLES_READY.then(function(updatedInventory){
    if(!Array.isArray(updatedInventory)) return;
    const refreshedVehicle = updatedInventory.find(v =>
      String(v.id) === String(vehicleId) &&
      String(v.status || "").toLowerCase() === "available"
    );
    if(refreshedVehicle){
      vehicle = refreshedVehicle;
      container.innerHTML = "";
      renderVehicle();
    }
  });
}
})();
</script>


<script>
document.querySelectorAll(".site-header").forEach(function(header){
  var menuButton=header.querySelector(".nav-toggle");
  var productsButton=header.querySelector(".nav-products");
  var productsMenu=header.querySelector(".nav-dropdown");
  if(menuButton){
    menuButton.addEventListener("click",function(){
      var opened=header.classList.toggle("nav-open");
      menuButton.setAttribute("aria-expanded",String(opened));
    });
  }
  if(productsButton&&productsMenu){
    productsButton.addEventListener("click",function(){
      var opened=productsMenu.classList.toggle("products-open");
      productsButton.setAttribute("aria-expanded",String(opened));
    });
  }
  document.addEventListener("click",function(event){
    if(!header.contains(event.target)){
      header.classList.remove("nav-open");
      if(menuButton)menuButton.setAttribute("aria-expanded","false");
      if(productsMenu)productsMenu.classList.remove("products-open");
      if(productsButton)productsButton.setAttribute("aria-expanded","false");
    }
  });
});
</script>
</body>
</html>
