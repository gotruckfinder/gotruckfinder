<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Browse available used commercial vehicles from China at Truck Finder.">
<title>Vehicle Inventory | Truck Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#17243a;background:#f5f7fa}
header{background:#102b50;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;font-weight:700}
main{max-width:1200px;margin:34px auto;padding:0 20px}
h1{font-size:30px;margin:0 0 8px}
.intro{color:#5d6b7d;margin:0 0 24px}
#vehicleCount{color:#596779;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 14px rgba(20,40,70,.08);display:flex;flex-direction:column}
.card a{color:inherit;text-decoration:none}
.card img{width:100%;height:220px;object-fit:cover;background:#e8edf3;display:block}
.card-body{padding:16px;display:flex;flex-direction:column;gap:9px;flex:1}
.card h2{font-size:18px;line-height:1.4;margin:0}
.specs{font-size:14px;color:#5c6878;line-height:1.55}
.price{font-size:17px;font-weight:700;color:#0b4385;margin-top:auto}
.view{display:inline-block;margin-top:8px;background:#124b8c;color:#fff!important;padding:11px 16px;border-radius:6px;text-align:center;font-weight:700}
.message{background:#fff;border-radius:10px;padding:24px;color:#596779}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main{margin:24px auto}.grid{grid-template-columns:1fr}.card img{height:210px}h1{font-size:25px}}
</style>
</head>
<body>
<header>
<a href="index.html">TRUCK FINDER</a>
<a href="index.html#inventory">All Categories</a>
</header>
<main>
<h1 id="categoryTitle">Vehicle Inventory</h1>
<p class="intro">Browse available used commercial vehicles from China. Select a vehicle to view specifications and send an inquiry.</p>
<p id="vehicleCount" aria-live="polite">Loading vehicles...</p>
<section class="grid" id="vehicleGrid"></section>
<div id="emptyMessage" class="message" hidden>No vehicles are currently published in this category. Please contact us if you have a specific requirement.</div>
</main>
<script src="vehicles.js"></script>
<script src="public-vehicles.js"></script>
<script>
(function(){
  const allowed = ["Truck Cranes","Aerial Work Platforms","Sanitation Trucks","Tank Trucks"];
  const params = new URLSearchParams(window.location.search);
  const category = params.get("category") || "Truck Cranes";
  const title = document.getElementById("categoryTitle");
  const count = document.getElementById("vehicleCount");
  const grid = document.getElementById("vehicleGrid");
  const empty = document.getElementById("emptyMessage");

  if(!allowed.includes(category)){
    title.textContent = "Vehicle Category Not Found";
    count.textContent = "";
    empty.hidden = false;
    return;
  }

  title.textContent = category;
  document.title = category + " | Truck Finder";

  function addText(parent, tag, className, value){
    const node = document.createElement(tag);
    if(className) node.className = className;
    node.textContent = value == null ? "" : String(value);
    parent.appendChild(node);
    return node;
  }

  function priceText(vehicle){
    const value = String(vehicle.price || "").trim();
    return value || "Price on Request";
  }

  window.TRUCK_FINDER_VEHICLES_READY.then(function(inventory){
    const vehicles = inventory.filter(function(vehicle){
      return vehicle.category === category &&
        String(vehicle.status || "").toLowerCase() === "available";
    });

    count.textContent = vehicles.length + " available vehicle(s)";
    empty.hidden = vehicles.length > 0;
    grid.replaceChildren();

    vehicles.forEach(function(vehicle){
      const card = document.createElement("article");
      card.className = "card";

      const link = document.createElement("a");
      link.href = "vehicle-details.html?id=" + encodeURIComponent(vehicle.id || "");
      const image = document.createElement("img");
      image.src = vehicle.image || (Array.isArray(vehicle.images) ? vehicle.images[0] : "") || "";
      image.alt = vehicle.title || category;
      image.loading = "lazy";
      image.onerror = function(){ this.style.display = "none"; };
      link.appendChild(image);

      const body = document.createElement("div");
      body.className = "card-body";
      addText(body,"h2","",vehicle.title || vehicle.id || "Available Vehicle");

      const specs = [
        vehicle.brand,
        vehicle.model,
        vehicle.year,
        vehicle.location
      ].filter(Boolean).join(" · ");
      addText(body,"p","specs",specs || category);
      addText(body,"p","price",priceText(vehicle));
      const view = addText(body,"span","view","View Details");
      link.appendChild(body);
      card.appendChild(link);
      grid.appendChild(card);
    });
  });
})();
</script>
</body>
</html>
