*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202936;background:#f7f8fa}a{color:inherit}.site-header{height:76px;background:#182536;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 5%;position:sticky;top:0;z-index:5}.site-nav{display:flex;align-items:center;gap:34px}.site-nav a{text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.04em}.site-nav a:hover{color:#9fc9f2}.hero{background:#182536;color:#fff;padding:68px 6%;text-align:center}.hero h1{font-size:42px;margin:0 0 12px}.hero p{color:#cbd5e1;margin:0;font-size:19px}.container{max-width:1180px;margin:42px auto;padding:0 22px}.video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:28px}.video-card{display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 5px 24px #15223512}.video-content{order:1;padding:24px 24px 18px}.video-content h2{font-size:25px;margin:0 0 12px;line-height:1.4}.video-content p{color:#5b6675;font-size:18px;line-height:1.75;margin:0}.video-media{order:2;width:100%;background:#111}.video-media video{display:block;width:100%;aspect-ratio:16/9;background:#111;object-fit:contain}.video-media img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#e8ebef}.video-placeholder{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,#182536,#38516d);color:#fff;font-size:20px;font-weight:700}.video-placeholder span{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border:2px solid #fff;border-radius:50%;font-size:26px}.external-link{display:inline-block;margin-top:16px;padding:12px 18px;background:#182536;color:#fff;text-decoration:none;border-radius:6px;font-size:16px;font-weight:700}.empty,.error{background:#fff;padding:34px;border-radius:10px;text-align:center;color:#697586}.footer{padding:30px;text-align:center;color:#7b8796;font-size:13px}@media(max-width:650px){.site-nav{gap:13px;flex-wrap:wrap;justify-content:center}.site-nav a{font-size:11px}.site-header{height:auto;min-height:64px;padding:15px}.hero h1{font-size:32px}}

/* Match the homepage's full-width rotating hero banners */
.hero{display:block!important;width:100%!important;min-height:0!important;height:auto!important;aspect-ratio:auto!important;padding:0!important;background:none!important;overflow:hidden}
.hero-carousel{position:relative;width:100%;overflow:hidden;touch-action:pan-y}
.hero-slide{display:none;width:100%}.hero-slide.is-active{display:block}
.hero-slide img{display:block;width:100%;max-width:100%;height:auto;object-fit:contain}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:42px;height:42px;border:0;border-radius:50%;background:rgba(5,35,82,.58);color:#fff;font-size:20px;cursor:pointer;display:grid;place-items:center}
.hero-prev{left:16px}.hero-next{right:16px}.hero-arrow:hover{background:rgba(5,35,82,.85)}

.hero-dot.is-active{background:#fff;transform:scale(1.2)}
.page-intro{background:#182536;color:#fff;padding:34px 6%;text-align:center}

.page-intro p{color:#cbd5e1;margin:0;font-size:17px;line-height:1.5}
@media(max-width:600px){.hero-arrow{width:34px;height:34px;font-size:16px}.hero-prev{left:9px}.hero-next{right:9px}.hero-dots{bottom:8px}.page-intro{padding:26px 5%}.page-intro h1{font-size:30px}}

<body>
<header class="site-header"><nav class="site-nav" aria-label="Main navigation">

</nav></header>
<section class="hero" aria-label="Featured truck banners">
  <div class="hero-carousel" id="page-hero-carousel">
    <div class="hero-slide is-active"><img src="https://images.gotruckfinder.com/banners/four%20trucks%20banner.jpg" alt="Truck Finder selection of four trucks" fetchpriority="high"></div>
    <div class="hero-slide"><img src="https://images.gotruckfinder.com/banners/gotruckfinder-banner1.png" alt="Used commercial vehicles from China" loading="lazy"></div>
    <button class="hero-arrow hero-prev" type="button" aria-label="Previous banner">&#10094;</button>
    <button class="hero-arrow hero-next" type="button" aria-label="Next banner">&#10095;</button>
    <div class="hero-dots" aria-label="Choose banner">
      <button class="hero-dot is-active" type="button" aria-label="Show banner 1" aria-current="true"></button>
      <button class="hero-dot" type="button" aria-label="Show banner 2" aria-current="false"></button>
    </div>
  </div>
</section>
<section class="page-intro"><h1>VIDEO GALLERY</h1><p>Explore vehicle walkarounds, equipment demonstrations and company videos.</p></section>
<main class="container"><div id="videoList" class="video-grid"><div class="empty">Loading videos...</div></div></main>
<footer class="footer">© GoTruckFinder. All rights reserved.</footer>
<script>
(function(){
  const carousel=document.getElementById("page-hero-carousel");if(!carousel)return;
  const slides=Array.from(carousel.querySelectorAll(".hero-slide"));
  const dots=Array.from(carousel.querySelectorAll(".hero-dot"));
  const prev=carousel.querySelector(".hero-prev"),next=carousel.querySelector(".hero-next");
  let current=0,timer=null,startX=0;
  function show(index){current=(index+slides.length)%slides.length;slides.forEach((el,i)=>el.classList.toggle("is-active",i===current));dots.forEach((el,i)=>{const active=i===current;el.classList.toggle("is-active",active);el.setAttribute("aria-current",String(active));});}
  function stop(){if(timer){clearInterval(timer);timer=null;}}
  function start(){stop();if(!document.hidden)timer=setInterval(()=>show(current+1),5000);}
  prev.addEventListener("click",()=>{show(current-1);start();});next.addEventListener("click",()=>{show(current+1);start();});
  dots.forEach((dot,i)=>dot.addEventListener("click",()=>{show(i);start();}));
  carousel.addEventListener("pointerdown",e=>{startX=e.clientX;});
  carousel.addEventListener("pointerup",e=>{const d=e.clientX-startX;if(Math.abs(d)>45){show(current+(d<0?1:-1));start();}});
  carousel.addEventListener("mouseenter",stop);carousel.addEventListener("mouseleave",start);
  carousel.addEventListener("focusin",stop);carousel.addEventListener("focusout",start);
  document.addEventListener("visibilitychange",()=>document.hidden?stop():start());show(0);start();
})();
</script>
<script>
(function(){
const target=document.getElementById("videoList");
function renderRichContent(value){
  const raw=String(value||"");if(!raw)return "";
  const doc=new DOMParser().parseFromString(raw,"text/html");
  const allowed=new Set(["P","BR","STRONG","B","EM","I","U","UL","OL","LI","H2","H3","BLOCKQUOTE","DIV","SPAN","IMG","A"]);
  const clean=node=>{Array.from(node.childNodes).forEach(child=>{
    if(child.nodeType===Node.ELEMENT_NODE){
      if(!allowed.has(child.tagName)){child.replaceWith(document.createTextNode(child.textContent||""));return;}
      Array.from(child.attributes).forEach(a=>{if(child.tagName==="IMG"&&["src","alt","title"].includes(a.name))return;if(child.tagName==="A"&&["href","title"].includes(a.name))return;child.removeAttribute(a.name);});
      if(child.tagName==="IMG"){try{const u=new URL(child.getAttribute("src")||"",location.href);if(u.protocol!=="https:"){child.remove();return;}}catch{child.remove();return;}child.setAttribute("loading","lazy");}
      if(child.tagName==="A"){try{const u=new URL(child.getAttribute("href")||"",location.href);if(u.protocol!=="https:")child.removeAttribute("href");else{child.setAttribute("rel","noopener noreferrer");child.setAttribute("target","_blank");}}catch{child.removeAttribute("href");}}
      clean(child);
    }else if(child.nodeType!==Node.TEXT_NODE){child.remove();}
  });};
  clean(doc.body);return doc.body.innerHTML;
}

function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function directVideo(url){return /\.(mp4|webm|mov)(\?.*)?$/i.test(url||"");}
fetch("https://gotruckfinder.com/api/public/videos",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Unable to load videos.");return r.json();}).then(data=>{
const items=data.items||[];if(!items.length){target.innerHTML='<div class="empty">No videos have been published yet.</div>';return;}
target.innerHTML=items.map(item=>{
const url=String(item.video_url||"");
const link=url&&!directVideo(url)?'<a class="external-link" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Watch Video</a>':"";
const text='<div class="video-content"><h2>'+esc(item.title)+'</h2>'+(item.summary?'<div class="video-summary">'+renderRichContent(item.summary)+'</div>':'')+link+'</div>';
const media=directVideo(url)?'<div class="video-media"><video controls preload="metadata"'+(item.cover_url?' poster="'+esc(item.cover_url)+'"':'')+' src="'+esc(url)+'"></video></div>':(item.cover_url?'<div class="video-media"><img src="'+esc(item.cover_url)+'" alt="'+esc(item.title)+'"></div>':'<div class="video-media"><div class="video-placeholder"><span>▶</span>VIDEO</div></div>');
return '<article class="video-card">'+text+media+'</article>';
}).join("");
}).catch(error=>{target.innerHTML='<div class="error">'+esc(error.message)+'</div>';});
})();
</script>
